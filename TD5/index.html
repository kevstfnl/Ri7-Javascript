<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>

<body>
    <div class="board">
        <canvas id="stage" height="300" width="400"></canvas>
        <div class="word">
            <p id="maskedWord"></p>
        </div>
    </div>
    <div class="user">
        <div id="used"></div>
        <div class="align">
            <label for="letter">Entre une lettre: </label>
            <input type="text" name="letter" id="letter" maxlength="1">
        </div>

        <button type="button" id="send">Envoyé</button>
    </div>

    <script src="main.js"></script>
</body>

</html>
